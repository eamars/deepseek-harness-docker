# The current dsh CLI rejects --host 0.0.0.0. This deployment patch binds the
# web server to the container interfaces so the Caddy service can proxy it on
# the internal Compose network.
- id: webserver
  config:
    host: 0.0.0.0
    port: 3080

# Opt into the official session-local Schedule tools. Schedule persists its
# reminders independently, so the optional time-context plugin is not mounted
# and cannot add a prompt on every new cycle.
- insert:
    - id: schedule
      name: '@deepseek-ai/dsh-schedule'

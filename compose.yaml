services:
  deepseek-harness:
    # The toolchain and host development packages are installed for amd64;
    # arm64 libraries are added as the Raspberry Pi target architecture.
    platform: linux/amd64

    build:
      context: .
      dockerfile: Dockerfile
      args:
        DSH_VERSION: ${DSH_VERSION:-0.2.1-rc.1}
        DSH_FORK_REPOSITORY: ${DSH_FORK_REPOSITORY:-https://github.com/eamars/deepseek-harness.git}
        DSH_FORK_COMMIT: ${DSH_FORK_COMMIT:-d67d7cf4fd17d2810efd7b514fec9e765326da75}
        DSH_MARKET_VERSION: ${DSH_MARKET_VERSION:-1.66.22}
        PNPM_VERSION: ${PNPM_VERSION:-12.4.2}

    image: deepseek-harness:local
    pull_policy: build
    container_name: deepseek-harness

    environment:
      DSH_HOME: /var/lib/dsh
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}

    # Host networking lets Caddy reach Harness on host loopback. Harness binds
    # 127.0.0.1:3080 only; DSH 0.2 refuses wildcard binds.
    network_mode: host

    volumes:
      - dsh-home:/var/lib/dsh
      - ccache-cache:/var/cache/ccache
      - ${DSH_WORKSPACE:-dsh-workspace}:/workspace

    working_dir: /workspace
    init: true
    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3080/').then(response => process.exit(response.status < 500 ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  caddy:
    image: caddy:2-alpine
    container_name: deepseek-harness-https
    # BusyBox wget can orphan its ssl_client helper during HTTPS checks.
    # Reap those children so they cannot retain seccomp/BPF kernel resources.
    init: true
    depends_on:
      deepseek-harness:
        condition: service_healthy

    # Caddy must see the original destination IP during the TLS handshake.
    # This lets it issue the correct private-LAN certificate at runtime.
    network_mode: host

    environment:
      CADDYFILE: |
        http:// {
            handle /caddy-local-root.crt {
                root * /data/caddy/pki/authorities/local
                rewrite * /root.crt
                file_server
            }

            handle {
                redir https://{http.request.host}{uri} permanent
            }
        }

        https:// {
            tls internal {
                on_demand
            }

            reverse_proxy 127.0.0.1:3080 {
                # This presents a loopback authority to Harness's server-side
                # /api fence. The Dockerfile patches the browser client to also
                # report loopback, so Settings > Models works from LAN HTTPS.
                header_up Host localhost:3080
                header_up Origin http://localhost:3080
            }
        }

    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '%s\n' "$$CADDYFILE" > /tmp/Caddyfile
        caddy fmt --overwrite /tmp/Caddyfile
        exec caddy run --config /tmp/Caddyfile --adapter caddyfile

    volumes:
      - caddy-data:/data
      - caddy-config:/config

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          response=$$(wget --server-response --spider --no-check-certificate
          https://localhost/ 2>&1); printf '%s\n' "$$response" |
          grep -Eq "HTTP/[0-9.]+ (2|3|401)"
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

    restart: unless-stopped

volumes:
  ccache-cache:
  dsh-home:
  dsh-workspace:
  caddy-data:
  caddy-config:

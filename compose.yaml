services:
  deepseek-harness:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DSH_VERSION: ${DSH_VERSION:-0.1.2-rc.1}
        DSH_MARKET_VERSION: ${DSH_MARKET_VERSION:-1.45.1}
        PNPM_VERSION: ${PNPM_VERSION:-10.34.5}

    image: deepseek-harness:local
    pull_policy: build
    container_name: deepseek-harness

    environment:
      DSH_HOME: /var/lib/dsh
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}

    # Host networking exposes the Docker server's real interfaces to Harness.
    # Its built-in all-interface runtime discovers and trusts the LAN IPs.
    network_mode: host

    volumes:
      - dsh-home:/var/lib/dsh
      - ${DSH_WORKSPACE:-dsh-workspace}:/workspace

    working_dir: /workspace
    init: true
    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3080/').then(response => process.exit(response.status < 500 ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  caddy:
    image: caddy:2-alpine
    container_name: deepseek-harness-https
    depends_on:
      deepseek-harness:
        condition: service_healthy

    # Caddy must see the original destination IP during the TLS handshake.
    # This lets it issue the correct private-LAN certificate at runtime.
    network_mode: host

    environment:
      CADDYFILE: |
        http:// {
            handle /caddy-local-root.crt {
                root * /data/caddy/pki/authorities/local
                rewrite * /root.crt
                file_server
            }

            handle {
                redir https://{http.request.host}{uri} permanent
            }
        }

        https:// {
            tls internal {
                on_demand
            }

            reverse_proxy localhost:3080 {
                # This presents a loopback authority to Harness's server-side
                # /api fence. The Dockerfile patches the browser client to also
                # report loopback, so Settings > Models works from LAN HTTPS.
                header_up Host localhost:3080
                header_up Origin http://localhost:3080
            }
        }

    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '%s\n' "$$CADDYFILE" > /tmp/Caddyfile
        caddy fmt --overwrite /tmp/Caddyfile
        exec caddy run --config /tmp/Caddyfile --adapter caddyfile

    volumes:
      - caddy-data:/data
      - caddy-config:/config

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget --quiet --spider --no-check-certificate
          https://localhost/ || test $$? -eq 8
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

    restart: unless-stopped

volumes:
  dsh-home:
  dsh-workspace:
  caddy-data:
  caddy-config:
